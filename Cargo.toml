[package]
name = "popo-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["Kyle Edward Donaldson"]
description = "Popocatépetl volcano monitoring CLI and library, reading a published JSON feed of official CENAPRED reports"
repository = "https://github.com/KyleEdwardDonaldson/PopoCLI"
homepage = "https://github.com/KyleEdwardDonaldson/PopoCLI"
documentation = "https://docs.rs/popo-cli"
readme = "README.md"
license = "MIT"
keywords = ["volcano", "monitoring", "mexico", "cli", "cenapred"]
categories = ["command-line-utilities", "science"]

# The published crate is the CLI and library only. Everything below is
# infrastructure for producing the feed, and `data/` in particular holds
# thousands of daily JSON reports that would bloat the package for no benefit:
# consumers fetch those over HTTP at runtime.
exclude = [
    "data/",
    "ingest/",
    ".github/",
    "docs/",
]

[[bin]]
name = "popo"
path = "src/main.rs"

[lib]
name = "popo_cli"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
